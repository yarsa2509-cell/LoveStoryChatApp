<script>
window.loginWithGoogle = async function(){
  try{
    if(!window.supabase){
      alert("Supabase JavaScript မတက်လာပါ");
      return;
    }

    if(typeof supabaseClient === "undefined"){
      alert("Supabase client မတက်လာပါ");
      return;
    }

    const {data,error}=await supabaseClient.auth.signInWithOAuth({
      provider:"google",
      options:{
        redirectTo:"lovestorychat://auth"
      }
    });

    if(error){
      alert("Google Login Error:\n"+error.message);
      console.error(error);
    }
  }catch(e){
    alert("Google Login Error:\n"+e.message);
    console.error(e);
  }
};
</script>

<script>
async function handleLoveStoryAuthCallback(url){
  if(!url || !url.startsWith("lovestorychat://auth")) return;

  const hash = url.split("#")[1] || "";
  const params = new URLSearchParams(hash);

  const access_token = params.get("access_token");
  const refresh_token = params.get("refresh_token");

  if(access_token && refresh_token){
    const {error} = await supabaseClient.auth.setSession({
      access_token,
      refresh_token
    });

    if(error){
      alert("Google Login session မဝင်ပါ: " + error.message);
      console.error(error);
      return;
    }

    await startApp();
  }
}

document.addEventListener("loveStoryAuthCallback", async (event)=>{
  const url = event.detail && event.detail.url;
  await handleLoveStoryAuthCallback(url);
});

document.addEventListener("DOMContentLoaded", async () => {
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener("appUrlOpen", async ({url})=>{
      await handleLoveStoryAuthCallback(url);
    });
  }
});



const SUPABASE_URL =
"https://ggeerngrxlpmwgnujqsb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_HV5s-ma1aCh1hMSZI686lw_JiX66gpC";

if(!window.supabase || typeof window.supabase.createClient !== "function"){
  throw new Error("Supabase local library မတက်လာပါ");
}

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

document.addEventListener("DOMContentLoaded",()=>{
supabaseClient.channel("messages-realtime")
  .on(
    "postgres_changes",
    {
      event:"INSERT",
      schema:"public",
      table:"messages"
    },
    async payload=>{
      const {data:{user}} =
        await supabaseClient.auth.getUser();

      const message=payload.new;

      if(
        user &&
        selectedUserId &&
        (
          (message.user_id===user.id &&
           message.receiver_id===selectedUserId) ||
          (message.user_id===selectedUserId &&
           message.receiver_id===user.id)
        )
      ){
        const box=document.getElementById("messages");

        if(
          message.id &&
          box &&
          box.querySelector(
            `[data-message-id="${message.id}"]`
          )
        ){
          return;
        }

        await addMessage(message);
        await loadChatUsers();

        if(box){
          requestAnimationFrame(()=>{
            box.scrollTop=box.scrollHeight;
          });
        }
      }
    }
  )
  .on(
    "postgres_changes",
    {
      event:"UPDATE",
      schema:"public",
      table:"messages"
    },
    async payload=>{
      const message=payload.new;
      const box=document.getElementById("messages");

      if(!box || !message.id) return;

      const item=box.querySelector(
        `[data-message-id="${message.id}"]`
      );

      if(!item) return;

      const seen=item.querySelector(".msgSeen");

      if(seen && message.seen){
        seen.textContent="✓✓";
      }
    }
  )
  .subscribe();
});

async function register(){
  const name=document.getElementById("registerName").value.trim();
  const email=document.getElementById("registerEmail").value.trim();
  const password=document.getElementById("registerPassword").value;

  if(!name || !email || !password){
    alert("Name, Email နဲ့ Password အားလုံးထည့်ပါ");
    return;
  }

  if(password.length < 6){
    alert("Password အနည်းဆုံး 6 လုံး ထည့်ပါ");
    return;
  }

  const {data,error}=await supabaseClient.auth.signUp({
    email:email,
    password:password
  });

  if(error){
    alert(error.message);
    return;
  }

  if(data.user){
    const {error:profileError}=await supabaseClient
      .from("profiles")
      .upsert({id:data.user.id,name:name});

    if(profileError){
      alert("Account ရပြီး Profile သိမ်းမရပါ:\n"+profileError.message);
      return;
    }

    const {error:publicError}=await supabaseClient
      .from("public_profiles")
      .upsert({id:data.user.id,name:name});

    if(publicError){
      alert("Account ရပြီး Public Profile သိမ်းမရပါ:\n"+publicError.message);
      return;
    }
  }

  if(data.session){
    startApp();
  }else{
    alert("Account ဖန်တီးပြီးပါပြီ။ Email ကိုစစ်ပြီး Confirm လုပ်ပြီး Login ဝင်ပါ ❤️");
    showLogin();
  }
}

    .style.display="block";

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("name,birthday,gender,avatar_url")
      .eq("id", (await supabaseClient.auth.getUser()).data.user.id)

    if(data.birthday){

    }

    if(data.avatar_url){
      document.querySelector(".avatar").src = data.avatar_url;
    }
  }

  loadMessages();
  loadChatUsers();

}

async function saveProfileDetails(){

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if(!user){
    alert("အရင် Login ဝင်ပါ");
    return;
  }

  const birthday =
    document.getElementById("birthdayInput").value;

  const gender =
    document.getElementById("genderInput").value;

  const file =
    document.getElementById("avatarInput").files[0];

  let avatar_url = null;

  if(file){

    const fileName =
      user.id + "_" + Date.now() + "_" + file.name;

    const { error } =
      await supabaseClient.storage
        .from("avatars")
        .upload(fileName, file);

    if(error){
      alert("Photo သိမ်းမရပါ:\n" + error.message);
      return;
    }

    const { data } =
      supabaseClient.storage
        .from("avatars")
        .getPublicUrl(fileName);

    avatar_url = data.publicUrl;
  }

  const profile = {
    id: user.id,
    birthday: birthday || null,
    gender: gender || null
  };

  if(avatar_url){
    profile.avatar_url = avatar_url;
  }

  const { error } =
    await supabaseClient
      .from("profiles")
      .upsert(profile);

  const publicProfile = {
    id: user.id,
    name: profile.name || null,
    avatar_url: profile.avatar_url || null
  };

  await supabaseClient
    .from("public_profiles")
    .upsert(publicProfile);

  if(error){
    alert("Profile သိမ်းမရပါ:\n" + error.message);
    return;
  }

  if(avatar_url){
    document.querySelector(".avatar").src = avatar_url;
  }

  alert("Profile သိမ်းပြီးပါပြီ ❤️");
}
let selectedUserId = null;

async function loadChatUsers(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) return;

  const {data:messages,error}=await supabaseClient
    .from("messages")
    .select("user_id,receiver_id,content,created_at,message_type")
    .or(`user_id.eq.${user.id},receiver_id.eq.${user.id}`)
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  const conversations=new Map();

  (messages || []).forEach(message=>{
    const otherId =
      message.user_id === user.id
        ? message.receiver_id
        : message.user_id;

    if(otherId && !conversations.has(otherId)){
      conversations.set(otherId,message);
    }
  });

  const ids=[...conversations.keys()];
  const list=document.getElementById("userList");

  if(!list) return;
  list.innerHTML="";

  if(ids.length===0){
    const empty=document.createElement("div");
    empty.className="emptyChats";
    empty.textContent="No chats yet";
    list.appendChild(empty);
    return;
  }

  const {data:profiles,error:profileError}=await supabaseClient
    .from("public_profiles")
    .select("id,name,avatar_url")
    .in("id",ids);

  if(profileError){
    console.error(profileError);
    return;
  }

  const profileMap={};

  (profiles || []).forEach(profile=>{
    profileMap[profile.id]=profile;
  });

  ids.forEach(id=>{
    const profile=profileMap[id];
    const last=conversations.get(id);

    if(!profile || !last) return;

    const button=document.createElement("button");
    button.className="chatUserItem";

    const avatar=document.createElement("img");
    avatar.className="chatUserAvatar";
    avatar.src=profile.avatar_url || "https://via.placeholder.com/50";
    avatar.alt="";

    const info=document.createElement("div");
    info.className="chatUserInfo";

    const name=document.createElement("div");
    name.className="chatUserName";
    name.textContent=profile.name || "User";

    const preview=document.createElement("div");
    preview.className="chatPreview";

    if(last.message_type === "text"){
      preview.textContent=last.content || "";
    }else{
      preview.textContent="Media";
    }

    info.appendChild(name);
    info.appendChild(preview);

    button.appendChild(avatar);
    button.appendChild(info);

    button.onclick=()=>{
      selectChatUser(profile);
    };

    list.appendChild(button);
  });
}

async function searchUsers(){
  const input=document.getElementById("userSearch");
  const results=document.getElementById("searchResults");

  if(!input || !results) return;

  const keyword=input.value.trim();

  results.innerHTML="";

  if(!keyword){
    return;
  }

  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) return;

  const {data,error}=await supabaseClient
    .from("public_profiles")
    .select("id,name,avatar_url")
    .neq("id",user.id)
    .eq("name",keyword)
    .order("name");

  if(error){
    console.error(error);
    return;
  }

  if(!data || data.length===0){
    const empty=document.createElement("div");
    empty.className="emptyChats";
    empty.textContent="Account မတွေ့ပါ";
    results.appendChild(empty);
    return;
  }

  data.forEach(profile=>{
    const item=document.createElement("button");
    item.className="chatUserItem searchUserItem";

    const avatar=document.createElement("img");
    avatar.className="chatUserAvatar";
    avatar.src=profile.avatar_url || "https://via.placeholder.com/50";
    avatar.alt="";

    const info=document.createElement("div");
    info.className="chatUserInfo";

    const name=document.createElement("div");
    name.className="chatUserName";
    name.textContent=profile.name || "User";

    info.appendChild(name);
    item.appendChild(avatar);
    item.appendChild(info);

    item.onclick=()=>{
      results.innerHTML="";
      input.value="";
      selectChatUser(profile);
    };

    results.appendChild(item);
  });
}

function selectChatUser(profile){
  selectedUserId = profile.id;

  const headerName = document.querySelector(".headerName");
  const headerStatus = document.querySelector(".headerStatus");
  const headerAvatar = document.querySelector(".headerAvatar");

  if(headerName){
    headerName.textContent = profile.name || "Chat";
  }

  if(headerStatus){
    headerStatus.textContent = "Online";
  }

  if(headerAvatar){
    headerAvatar.innerHTML = "";

    if(profile.avatar_url){
      const img = document.createElement("img");
      img.src = profile.avatar_url;
      img.style.width = "42px";
      img.style.height = "42px";
      img.style.borderRadius = "50%";
      img.style.objectFit = "cover";
      headerAvatar.appendChild(img);
    }else{
      headerAvatar.textContent = "LS";
    }
  }

  loadMessages();
}

async function loadMessages(){

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if(!user || !selectedUserId) return;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(user_id.eq.${user.id},receiver_id.eq.${selectedUserId}),and(user_id.eq.${selectedUserId},receiver_id.eq.${user.id})`
      )
      .order("created_at", {ascending:true});

  if(error){
    console.error(error);
    return;
  }

  const box=document.getElementById("messages");
  if(!box) return;

  // Mark received messages as seen before rendering.
  await supabaseClient
    .from("messages")
    .update({seen:true})
    .eq("receiver_id", user.id)
    .eq("user_id", selectedUserId)
    .eq("seen", false);

  box.innerHTML="";

  for(const message of (data || [])){
    if(
      message.receiver_id === user.id &&
      message.user_id === selectedUserId
    ){
      message.seen=true;
    }

    await addMessage(message);
  }

  // Scroll only once after all messages are rendered.
  requestAnimationFrame(()=>{
    box.scrollTop=box.scrollHeight;
  });
}

async function addMessage(message){
  const box = document.getElementById("messages");
  if(!box) return;

  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user) return;

  if(message.id && box.querySelector(`[data-message-id="${message.id}"]`)){
    return;
  }

  const div = document.createElement("div");
  div.className = "msg " + (message.user_id === user.id ? "me" : "other");

  if(message.id){
    div.dataset.messageId = message.id;
  }

  const text = document.createElement("div");
  text.textContent = message.content || "";

  const meta = document.createElement("div");
  meta.className = "msgMeta";

  const time = document.createElement("span");
  time.className = "msgTime";

  if(message.created_at){
    const date = new Date(message.created_at);
    time.textContent = date.toLocaleTimeString([], {
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  meta.appendChild(time);

  if(message.user_id === user.id){
    const seen = document.createElement("span");
    seen.className = "msgSeen";
    seen.textContent = message.seen ? "✓✓" : "✓";
    meta.appendChild(seen);
  }

  div.appendChild(text);
  div.appendChild(meta);
  box.appendChild(div);
}

async function sendMessage(){

  const input=document.getElementById("messageInput");
  if(!input) return;

  const content=input.value.trim();

  if(!content) return;

  if(!selectedUserId){
    alert("အရင် Chat User တစ်ယောက်ရွေးပါ");
    return;
  }

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user) return;

  // Clear immediately so the same text cannot be submitted twice.
  input.value="";
  input.disabled=true;

  const {data:message,error} =
    await supabaseClient
      .from("messages")
      .insert({
        user_id:user.id,
        receiver_id:selectedUserId,
        content:content,
        message_type:"text"
      })
      .select()
      .single();

  input.disabled=false;
  input.focus();

  if(error){
    input.value=content;
    alert(error.message);
    return;
  }

  await addMessage(message);

  const box=document.getElementById("messages");

  if(box){
    requestAnimationFrame(()=>{
      box.scrollTop=box.scrollHeight;
    });
  }

  await loadChatUsers();
}



// Restore existing login session when the app opens
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      await startApp();
    }
  } catch (e) {
    console.error("Session restore error:", e);
  }
});
